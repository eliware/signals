version: "14.0"
description: Requirements for the Eliware signals library.
directives:
  - id: E-105.0
    dos:
      - Provide a native ESM API for process signal handling and graceful shutdown.
      - Run shutdown functions in order and continue after each function error.
      - Keep the public API and type declarations in agreement with the documentation.
    donts:
      - Do not run asynchronous shutdown functions from Node.js exit events.
      - Do not use validation as approval to publish or deploy.
